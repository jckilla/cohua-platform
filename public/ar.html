<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>COHUA AR</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Segoe UI',sans-serif; touch-action:none; }

    /* Camera feed fills screen */
    #camera-feed {
      position:fixed; inset:0; width:100%; height:100%;
      object-fit:cover; z-index:1;
    }

    /* AR canvas sits on top of camera */
    #ar-canvas {
      position:fixed; inset:0; width:100%; height:100%;
      z-index:2; pointer-events:none;
    }

    /* HUD */
    #hud {
      position:fixed; top:0; left:0; right:0; z-index:10;
      background:rgba(0,0,0,0.75); backdrop-filter:blur(10px);
      padding:10px 16px;
      display:flex; align-items:center; justify-content:space-between;
      border-bottom:1px solid rgba(0,243,255,0.2);
    }
    #hud-logo { font-size:18px; font-weight:900; color:#00f3ff; letter-spacing:1px; text-shadow:0 0 10px #00f3ff80; }
    #hud-right { text-align:right; }
    .hud-stat { font-size:10px; display:block; }
    .green  { color:#00ff66; }
    .yellow { color:#ffd700; }
    .red    { color:#ff4466; }
    .gray   { color:#555; }

    /* Bottom cards */
    #cards {
      position:fixed; bottom:0; left:0; right:0; z-index:10;
      padding:10px 10px 24px;
      background:linear-gradient(transparent, rgba(0,0,0,0.9));
      display:none;
    }
    #cards-row { display:flex; gap:8px; overflow-x:auto; }
    #cards-row::-webkit-scrollbar { display:none; }
    .card {
      flex-shrink:0; min-width:155px; background:rgba(0,0,0,0.85);
      border-radius:12px; padding:10px 13px;
      border:1px solid rgba(0,243,255,0.3);
    }
    .card-name { font-size:12px; font-weight:700; color:#fff; margin-bottom:3px; }
    .card-dist { font-size:11px; font-weight:600; margin-bottom:2px; }
    .card-loc  { font-size:10px; color:#555; }

    /* Startup screen */
    #startup {
      position:fixed; inset:0; z-index:999;
      background:#000; color:#fff;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:32px; text-align:center;
    }
    #startup.gone { display:none; }
    .logo { font-size:38px; font-weight:900; color:#00f3ff; text-shadow:0 0 24px #00f3ff80; margin-bottom:6px; }
    .tagline { font-size:13px; color:#555; margin-bottom:36px; }
    .start-btn {
      background:#00f3ff; color:#000; font-weight:800; font-size:16px;
      border:none; border-radius:14px; padding:16px 0; width:100%; max-width:280px;
      cursor:pointer; box-shadow:0 0 24px #00f3ff50;
    }
    .start-btn:disabled { opacity:0.5; cursor:default; }
    .start-msg { font-size:12px; color:#444; margin-top:14px; min-height:18px; }
    .steps { margin-top:28px; text-align:left; max-width:280px; }
    .step { font-size:12px; color:#333; padding:7px 0; border-bottom:1px solid #111; display:flex; gap:10px; align-items:flex-start; }
    .step-num { color:#00f3ff; font-weight:700; flex-shrink:0; }

    /* Compass indicator */
    #compass {
      position:fixed; top:58px; left:50%; transform:translateX(-50%);
      z-index:10; display:none;
      background:rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.1);
      border-radius:20px; padding:4px 12px;
      font-size:10px; color:#555;
    }
  </style>
</head>
<body>

<!-- Startup -->
<div id="startup">
  <div class="logo">COHUA</div>
  <div class="tagline">Augmented Reality Ad Network</div>
  <button class="start-btn" id="start-btn" onclick="boot()">&#x1F4F7;&nbsp; Open AR Camera</button>
  <p class="start-msg" id="start-msg">Camera &amp; location required</p>
  <div class="steps">
    <div class="step"><span class="step-num">1</span><span>Allow camera when prompted</span></div>
    <div class="step"><span class="step-num">2</span><span>Allow location when prompted</span></div>
    <div class="step"><span class="step-num">3</span><span>Point phone at nearby businesses</span></div>
  </div>
</div>

<!-- Camera passthrough -->
<video id="camera-feed" autoplay playsinline muted></video>

<!-- AR overlay canvas -->
<canvas id="ar-canvas"></canvas>

<!-- HUD -->
<div id="hud" style="display:none">
  <div id="hud-logo">COHUA</div>
  <div id="hud-right">
    <span class="hud-stat yellow" id="stat-gps">&#9679; Locating...</span>
    <span class="hud-stat gray"   id="stat-ads">Scanning...</span>
  </div>
</div>

<!-- Compass debug -->
<div id="compass"></div>

<!-- Bottom cards -->
<div id="cards">
  <div id="cards-row"></div>
</div>

<script>
const SB_URL = 'https://sgredejirqatcmstlzqi.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNncmVkZWppcnFhdGNtc3RsenFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwMDY3NTUsImV4cCI6MjA4ODU4Mjc1NX0.bV19P9HmMSDe4JGAmJHcmCIjN3kbZvHTuurmCRVD_sA';
const sb = window.supabase.createClient(SB_URL, SB_KEY);

const RADIUS_M = 914;   // 3000 ft
const SCAN_MS  = 6000;

let userLat = null, userLng = null;
let heading = 0;        // degrees, 0=north, clockwise
let campaigns = [];
let animFrame = null;
let scanTimer = null;
let running   = false;

// ── helpers ──────────────────────────────────────────────────────────────────
function haversine(la1,lo1,la2,lo2){
  const R=6371000,r=Math.PI/180;
  const dLa=(la2-la1)*r, dLo=(lo2-lo1)*r;
  const a=Math.sin(dLa/2)**2+Math.cos(la1*r)*Math.cos(la2*r)*Math.sin(dLo/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
const toFt = m=>Math.round(m*3.28084);
function bearing(la1,lo1,la2,lo2){
  const r=Math.PI/180;
  const dLo=(lo2-lo1)*r;
  const y=Math.sin(dLo)*Math.cos(la2*r);
  const x=Math.cos(la1*r)*Math.sin(la2*r)-Math.sin(la1*r)*Math.cos(la2*r)*Math.cos(dLo);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
function neonColor(c){
  try{ return JSON.parse(c.deploy_payload||'{}').neon_color||'#ff00ff'; }catch{ return '#ff00ff'; }
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ── BOOT ──────────────────────────────────────────────────────────────────────
async function boot(){
  const btn=document.getElementById('start-btn');
  const msg=document.getElementById('start-msg');
  btn.disabled=true; btn.textContent='Starting...';

  // Camera
  msg.textContent='Requesting camera...';
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'environment', width:{ideal:1280}, height:{ideal:720}},
      audio:false
    });
  }catch(e){
    msg.textContent='Camera denied. Allow in browser settings and refresh.';
    btn.disabled=false; btn.textContent='\uD83D\uDCF7 Open AR Camera'; return;
  }
  const vid=document.getElementById('camera-feed');
  vid.srcObject=stream;
  await vid.play();

  // GPS
  if(!navigator.geolocation){msg.textContent='GPS not supported.'; btn.disabled=false; return;}
  msg.textContent='Getting location...';
  navigator.geolocation.getCurrentPosition(
    pos=>{ userLat=pos.coords.latitude; userLng=pos.coords.longitude; _go(); },
    ()=>{ msg.textContent='Location denied. Enable location and refresh.'; btn.disabled=false; btn.textContent='\uD83D\uDCF7 Open AR Camera'; },
    {enableHighAccuracy:true,timeout:15000,maximumAge:0}
  );
}

function _go(){
  running=true;
  document.getElementById('startup').classList.add('gone');
  document.getElementById('hud').style.display='flex';

  // Resize canvas
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  // GPS watch
  navigator.geolocation.watchPosition(
    p=>{
      userLat=p.coords.latitude; userLng=p.coords.longitude;
      const el=document.getElementById('stat-gps');
      el.textContent=`\u2022 GPS \u00b1${Math.round(p.coords.accuracy)}m`;
      el.className='hud-stat green';
    },
    ()=>{ const el=document.getElementById('stat-gps'); el.textContent='\u2022 GPS lost'; el.className='hud-stat red'; },
    {enableHighAccuracy:true,timeout:5000,maximumAge:2000}
  );

  // Compass / orientation
  _startCompass();

  // First scan
  scan();
  scanTimer=setInterval(scan,SCAN_MS);

  // Render loop
  animFrame=requestAnimationFrame(renderLoop);
}

function resizeCanvas(){
  const c=document.getElementById('ar-canvas');
  c.width=window.innerWidth; c.height=window.innerHeight;
}

// ── COMPASS ───────────────────────────────────────────────────────────────────
function _startCompass(){
  // DeviceOrientationEvent — works on iOS 13+ with permission, Android always
  const handler=e=>{
    if(e.webkitCompassHeading!==undefined){
      // iOS: webkitCompassHeading is 0=North clockwise, already corrected
      heading=e.webkitCompassHeading;
    } else if(e.alpha!==null){
      // Android: alpha is CCW from South, convert to CW from North
      heading=(360-e.alpha)%360;
    }
    document.getElementById('compass').textContent=`Heading: ${Math.round(heading)}\u00b0`;
  };

  if(typeof DeviceOrientationEvent!=='undefined' &&
     typeof DeviceOrientationEvent.requestPermission==='function'){
    // iOS 13+
    DeviceOrientationEvent.requestPermission().then(state=>{
      if(state==='granted') window.addEventListener('deviceorientation', handler);
      document.getElementById('compass').style.display='block';
    }).catch(()=>{});
  } else {
    window.addEventListener('deviceorientation', handler);
    document.getElementById('compass').style.display='block';
  }
}

// ── SCAN SUPABASE ─────────────────────────────────────────────────────────────
async function scan(){
  if(!userLat||!userLng) return;
  document.getElementById('stat-ads').textContent='Scanning...';
  const {data,error}=await sb.from('campaigns')
    .select('id,name,asset_type,latitude,longitude,location_label,deploy_payload')
    .eq('status','live').not('latitude','is',null);
  if(error){ console.error(error); return; }
  campaigns=(data||[])
    .map(c=>({...c,
      _m: haversine(userLat,userLng,c.latitude,c.longitude),
      _bear: bearing(userLat,userLng,c.latitude,c.longitude)
    }))
    .filter(c=>c._m<=RADIUS_M)
    .sort((a,b)=>a._m-b._m);

  const el=document.getElementById('stat-ads');
  if(campaigns.length){
    el.textContent=`${campaigns.length} AR ad${campaigns.length>1?'s':''} nearby`;
    el.className='hud-stat green';
  } else {
    el.textContent='No AR ads within 3,000 ft';
    el.className='hud-stat gray';
  }
  renderCards();
}

// ── RENDER LOOP ───────────────────────────────────────────────────────────────
function renderLoop(){
  drawAR();
  animFrame=requestAnimationFrame(renderLoop);
}

// Field of view: assume ~60 degrees horizontal
const H_FOV = 60;

function drawAR(){
  const canvas=document.getElementById('ar-canvas');
  const ctx=canvas.getContext('2d');
  const W=canvas.width, H=canvas.height;
  ctx.clearRect(0,0,W,H);

  if(!campaigns.length||!userLat) return;

  campaigns.forEach(c=>{
    const color=neonColor(c);
    const name=c.name.replace(/\[DEMO\]\s*/,'').trim();
    const ft=toFt(c._m);

    // Angle of this sign relative to phone heading
    // bearingDiff: how many degrees off-center is this sign
    let diff=(c._bear-heading+360)%360;
    if(diff>180) diff-=360;  // -180 to +180

    // Only render if within FOV (with a little extra so signs slide in)
    if(Math.abs(diff)>H_FOV*0.75) return;

    // X position: center of screen + offset based on bearing diff
    const x = W/2 + (diff/H_FOV)*W;
    // Y position: fixed at 35% from top (upper portion of screen)
    const Y_BASE = H * 0.35;

    // Sign dimensions
    const SW=260, SH=90, R=14;

    // Glow effect
    ctx.save();
    ctx.shadowColor=color;
    ctx.shadowBlur=32;

    // Backing panel
    roundRect(ctx, x-SW/2, Y_BASE-SH/2, SW, SH, R);
    ctx.fillStyle='rgba(0,0,0,0.82)';
    ctx.fill();

    // Neon border
    roundRect(ctx, x-SW/2, Y_BASE-SH/2, SW, SH, R);
    ctx.strokeStyle=color;
    ctx.lineWidth=2.5;
    ctx.stroke();

    // Top neon bar
    ctx.fillStyle=color;
    ctx.globalAlpha=0.9;
    roundRect(ctx, x-SW/2+R, Y_BASE-SH/2, SW-R*2, 4, 2);
    ctx.fill();

    // Bottom neon bar
    roundRect(ctx, x-SW/2+R, Y_BASE+SH/2-4, SW-R*2, 4, 2);
    ctx.fill();

    ctx.globalAlpha=1;

    // Business name
    ctx.fillStyle=color;
    ctx.font='bold 17px \'Segoe UI\', sans-serif';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(truncate(name,22), x, Y_BASE-12);

    // Distance
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.font='11px \'Segoe UI\', sans-serif';
    ctx.fillText(`${ft} FT AWAY`, x, Y_BASE+14);

    // Arrow pointing down toward business
    ctx.fillStyle=color;
    ctx.globalAlpha=0.8;
    const arrowY = Y_BASE+SH/2+12;
    ctx.beginPath();
    ctx.moveTo(x-10, arrowY);
    ctx.lineTo(x+10, arrowY);
    ctx.lineTo(x, arrowY+18);
    ctx.closePath();
    ctx.fill();

    // Vertical line from arrow to edge
    ctx.globalAlpha=0.25;
    ctx.strokeStyle=color;
    ctx.lineWidth=1.5;
    ctx.setLineDash([4,4]);
    ctx.beginPath();
    ctx.moveTo(x, arrowY+18);
    ctx.lineTo(x, H*0.75);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.restore();
  });
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

function truncate(s,n){ return s.length>n ? s.slice(0,n)+'\u2026':s; }

// ── BOTTOM CARDS ──────────────────────────────────────────────────────────────
function renderCards(){
  const el=document.getElementById('cards');
  const row=document.getElementById('cards-row');
  if(!campaigns.length){ el.style.display='none'; return; }
  el.style.display='block';
  row.innerHTML=campaigns.map(c=>{
    const color=neonColor(c);
    const name=c.name.replace(/\[DEMO\]\s*/,'').trim();
    const loc=c.location_label||`${c.latitude.toFixed(4)}, ${c.longitude.toFixed(4)}`;
    return `<div class="card" style="border-color:${color}50">
      <div class="card-name">${esc(name)}</div>
      <div class="card-dist" style="color:${color}">${String.fromCharCode(9670)} ${toFt(c._m)} ft</div>
      <div class="card-loc">${esc(loc)}</div>
    </div>`;
  }).join('');
}

// Pause/resume
document.addEventListener('visibilitychange',()=>{
  if(!running) return;
  if(document.hidden){ if(animFrame){cancelAnimationFrame(animFrame);animFrame=null;} clearInterval(scanTimer);scanTimer=null; }
  else{ scan(); scanTimer=setInterval(scan,SCAN_MS); if(!animFrame) animFrame=requestAnimationFrame(renderLoop); }
});
</script>
</body>
</html>
