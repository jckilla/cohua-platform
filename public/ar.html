<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>COHUA AR</title>

  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.5/aframe/build/aframe-ar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; background:#000; font-family:'Segoe UI',sans-serif; }
    #startup {
      position:fixed; inset:0; z-index:9999;
      background:#000;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:32px; text-align:center; color:#fff;
    }
    #startup.hidden { display:none; }
    .s-logo { font-size:36px; font-weight:900; color:#00f3ff; letter-spacing:2px; text-shadow:0 0 24px #00f3ff80; margin-bottom:8px; }
    .s-sub  { font-size:13px; color:#666; margin-bottom:40px; }
    .s-btn  { background:#00f3ff; color:#000; font-weight:800; font-size:16px; border:none; border-radius:14px; padding:16px 32px; cursor:pointer; box-shadow:0 0 24px #00f3ff60; width:100%; max-width:280px; }
    .s-btn:disabled { opacity:0.5; }
    .s-msg  { font-size:12px; color:#555; margin-top:14px; min-height:18px; }
    .s-steps { margin-top:28px; text-align:left; max-width:280px; }
    .s-step { font-size:12px; color:#444; padding:6px 0; border-bottom:1px solid #111; display:flex; gap:10px; }
    .s-step span { color:#00f3ff; font-weight:700; }
    #hud { position:fixed; top:0; left:0; right:0; z-index:8000; pointer-events:none; }
    #hud-bar {
      background:rgba(0,0,0,0.8); backdrop-filter:blur(12px);
      padding:10px 16px;
      display:flex; align-items:center; justify-content:space-between;
      border-bottom:1px solid rgba(0,243,255,0.15);
    }
    #hud-logo { font-size:17px; font-weight:900; color:#00f3ff; letter-spacing:1px; text-shadow:0 0 8px #00f3ff; }
    #hud-right { text-align:right; }
    .hud-line { font-size:10px; display:block; margin-top:1px; }
    .hud-green { color:#00ff66; }
    .hud-yellow { color:#ffd700; }
    .hud-red { color:#ff4466; }
    .hud-gray { color:#555; }
    #cards-strip {
      position:fixed; bottom:0; left:0; right:0; z-index:8000;
      padding:10px 10px 20px;
      background:linear-gradient(transparent,rgba(0,0,0,0.9));
      display:none;
    }
    #cards-row { display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; }
    #cards-row::-webkit-scrollbar { display:none; }
    .ncard {
      flex-shrink:0; min-width:150px; max-width:190px;
      background:rgba(0,0,0,0.85); border-radius:12px;
      padding:10px 12px; border:1px solid rgba(0,243,255,0.25);
    }
    .ncard-name { font-size:12px; font-weight:700; color:#fff; margin-bottom:4px; }
    .ncard-dist { font-size:11px; font-weight:600; margin-bottom:2px; }
    .ncard-loc  { font-size:10px; color:#555; }
    #no-signal {
      position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
      z-index:8000; display:none;
      background:rgba(0,0,0,0.8); border:1px solid #333;
      border-radius:20px; padding:8px 16px;
      font-size:11px; color:#555; white-space:nowrap;
    }
  </style>
</head>
<body>

<div id="startup">
  <div class="s-logo">COHUA</div>
  <div class="s-sub">Augmented Reality Ad Network</div>
  <button class="s-btn" id="start-btn" onclick="startAR()">&#x1F4F7; &nbsp;Open AR Camera</button>
  <p class="s-msg" id="start-msg">Camera &amp; location required</p>
  <div class="s-steps">
    <div class="s-step"><span>1</span> Allow camera access when prompted</div>
    <div class="s-step"><span>2</span> Allow location access when prompted</div>
    <div class="s-step"><span>3</span> Point at nearby businesses to see AR ads</div>
  </div>
</div>

<div id="hud" style="display:none">
  <div id="hud-bar">
    <div id="hud-logo">COHUA</div>
    <div id="hud-right">
      <span class="hud-line hud-yellow" id="hud-gps">&#x25CF; Locating GPS...</span>
      <span class="hud-line hud-gray" id="hud-ads">Scanning for ads...</span>
    </div>
  </div>
</div>

<div id="cards-strip">
  <div id="cards-row"></div>
</div>

<div id="no-signal">No AR ads within 3,000 ft</div>

<a-scene
  id="main-scene"
  vr-mode-ui="enabled:false"
  arjs="sourceType:webcam; videoTexture:true; debugUIEnabled:false;"
  renderer="antialias:true; alpha:true;"
  embedded
  style="display:none; position:fixed; inset:0;">

  <a-camera gps-camera rotation-reader></a-camera>
  <a-entity id="ar-root"></a-entity>

</a-scene>

<script>
const SUPABASE_URL = 'https://sgredejirqatcmstlzqi.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNncmVkZWppcnFhdGNtc3RsenFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwMDY3NTUsImV4cCI6MjA4ODU4Mjc1NX0.bV19P9HmMSDe4JGAmJHcmCIjN3kbZvHTuurmCRVD_sA';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const RADIUS_M   = 914;   // 3000 feet
const SIGN_Y     = 7;     // meters above ground
const SCAN_EVERY = 8000;

let lat = null, lng = null;
let gpsWatch = null;
let scanTimer = null;
let running = false;

function haversine(lat1,lon1,lat2,lon2){
  const R=6371000, r=Math.PI/180;
  const dLat=(lat2-lat1)*r, dLon=(lon2-lon1)*r;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
const toFt = m => Math.round(m*3.28084);

function neonColor(c){
  try { return JSON.parse(c.deploy_payload||'{}').neon_color||'#00f3ff'; }
  catch { return '#00f3ff'; }
}

async function startAR(){
  const btn = document.getElementById('start-btn');
  const msg = document.getElementById('start-msg');
  btn.disabled = true; btn.textContent = 'Starting...';
  msg.textContent = 'Requesting camera access...';
  try {
    await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
  } catch(e){
    msg.textContent = 'Camera denied. Allow camera access in browser settings and refresh.';
    btn.disabled=false; btn.textContent='\uD83D\uDCF7 Open AR Camera'; return;
  }
  if(!navigator.geolocation){
    msg.textContent='GPS not supported on this device.';
    btn.disabled=false; return;
  }
  msg.textContent='Getting your location...';
  navigator.geolocation.getCurrentPosition(
    pos => { lat=pos.coords.latitude; lng=pos.coords.longitude; _launch(); },
    () => {
      msg.textContent='Location denied. Enable location and refresh.';
      btn.disabled=false; btn.textContent='\uD83D\uDCF7 Open AR Camera';
    },
    {enableHighAccuracy:true, timeout:15000, maximumAge:0}
  );
}

function _launch(){
  running = true;
  document.getElementById('startup').classList.add('hidden');
  document.getElementById('hud').style.display='block';
  document.getElementById('main-scene').style.display='block';
  gpsWatch = navigator.geolocation.watchPosition(
    pos=>{
      lat=pos.coords.latitude; lng=pos.coords.longitude;
      const el=document.getElementById('hud-gps');
      el.textContent=`\u25CF GPS \u00b1${Math.round(pos.coords.accuracy)}m`;
      el.className='hud-line hud-green';
    },
    ()=>{
      const el=document.getElementById('hud-gps');
      el.textContent='\u25CF GPS lost'; el.className='hud-line hud-red';
    },
    {enableHighAccuracy:true, timeout:5000, maximumAge:2000}
  );
  scan();
  scanTimer = setInterval(scan, SCAN_EVERY);
}

async function scan(){
  if(!lat||!lng) return;
  document.getElementById('hud-ads').textContent='Scanning...';
  const {data,error} = await sb
    .from('campaigns')
    .select('id,name,asset_type,latitude,longitude,location_label,deploy_payload')
    .eq('status','live')
    .not('latitude','is',null);
  if(error){ console.error(error); return; }
  const nearby = (data||[])
    .map(c=>({...c, _m: haversine(lat,lng,c.latitude,c.longitude)}))
    .filter(c=>c._m<=RADIUS_M)
    .sort((a,b)=>a._m-b._m);
  const adsEl = document.getElementById('hud-ads');
  if(nearby.length){
    adsEl.textContent=`${nearby.length} AR ad${nearby.length>1?'s':''} nearby`;
    adsEl.className='hud-line hud-green';
    document.getElementById('no-signal').style.display='none';
  } else {
    adsEl.textContent='No AR ads within 3,000 ft';
    adsEl.className='hud-line hud-gray';
    document.getElementById('no-signal').style.display='block';
  }
  renderAREntities(nearby);
  renderCards(nearby);
}

function renderAREntities(campaigns){
  const root = document.getElementById('ar-root');
  root.innerHTML = '';
  const Y = SIGN_Y; // 7 meters — sign center height

  campaigns.forEach(c=>{
    const color = neonColor(c);
    const name  = c.name.replace(/\[DEMO\]\s*/,'').trim();
    const label = name.length>20 ? name.slice(0,20)+'\u2026' : name;
    const ft    = toFt(c._m);
    const typeStr = {
      neon_logo:'NEON LOGO', neon_menu:'NEON MENU',
      neon_image:'NEON IMAGE', custom_3d:'3D AD'
    }[c.asset_type]||'AR AD';

    const wrapper = document.createElement('a-entity');
    wrapper.setAttribute('gps-entity-place', `latitude:${c.latitude}; longitude:${c.longitude}`);
    wrapper.setAttribute('look-at', '[gps-camera]');

    // Sign panel (centered at Y meters)
    const panel = document.createElement('a-plane');
    panel.setAttribute('position',`0 ${Y} 0`);
    panel.setAttribute('width','3.5');
    panel.setAttribute('height','1.5');
    panel.setAttribute('color','#050505');
    panel.setAttribute('opacity','0.85');
    panel.setAttribute('side','double');

    // Top neon bar
    const topBar = document.createElement('a-plane');
    topBar.setAttribute('position',`0 ${Y+0.73} 0.01`);
    topBar.setAttribute('width','3.5');
    topBar.setAttribute('height','0.06');
    topBar.setAttribute('color',color);
    topBar.setAttribute('emissive',color);
    topBar.setAttribute('emissive-intensity','2');

    // Bottom neon bar
    const botBar = document.createElement('a-plane');
    botBar.setAttribute('position',`0 ${Y-0.73} 0.01`);
    botBar.setAttribute('width','3.5');
    botBar.setAttribute('height','0.06');
    botBar.setAttribute('color',color);
    botBar.setAttribute('emissive',color);
    botBar.setAttribute('emissive-intensity','2');

    // Business name
    const nameText = document.createElement('a-text');
    nameText.setAttribute('value',label);
    nameText.setAttribute('color',color);
    nameText.setAttribute('align','center');
    nameText.setAttribute('width','4');
    nameText.setAttribute('position',`0 ${Y+0.12} 0.02`);

    // Sub-label
    const subText = document.createElement('a-text');
    subText.setAttribute('value',`${typeStr}   \u00b7   ${ft} FT AWAY`);
    subText.setAttribute('color','#666666');
    subText.setAttribute('align','center');
    subText.setAttribute('width','2.5');
    subText.setAttribute('position',`0 ${Y-0.28} 0.02`);

    // Vertical pole from ground to sign
    const pole = document.createElement('a-cylinder');
    pole.setAttribute('position',`0 ${Y/2} 0`);
    pole.setAttribute('radius','0.025');
    pole.setAttribute('height',`${Y}`);
    pole.setAttribute('color',color);
    pole.setAttribute('opacity','0.5');
    pole.setAttribute('emissive',color);
    pole.setAttribute('emissive-intensity','1');

    // Ground circle
    const ground = document.createElement('a-circle');
    ground.setAttribute('position','0 0.01 0');
    ground.setAttribute('radius','0.5');
    ground.setAttribute('color',color);
    ground.setAttribute('opacity','0.25');
    ground.setAttribute('rotation','-90 0 0');

    // Pulsing ring
    const ring = document.createElement('a-ring');
    ring.setAttribute('position','0 0.02 0');
    ring.setAttribute('radius-inner','0.5');
    ring.setAttribute('radius-outer','0.7');
    ring.setAttribute('color',color);
    ring.setAttribute('opacity','0.4');
    ring.setAttribute('rotation','-90 0 0');
    ring.setAttribute('animation',
      'property:scale; from:1 1 1; to:2.5 2.5 2.5; dur:2000; easing:easeOutCubic; loop:true; dir:alternate');

    wrapper.appendChild(panel);
    wrapper.appendChild(topBar);
    wrapper.appendChild(botBar);
    wrapper.appendChild(nameText);
    wrapper.appendChild(subText);
    wrapper.appendChild(pole);
    wrapper.appendChild(ground);
    wrapper.appendChild(ring);
    root.appendChild(wrapper);
  });
}

function renderCards(campaigns){
  const strip = document.getElementById('cards-strip');
  const row   = document.getElementById('cards-row');
  if(!campaigns.length){ strip.style.display='none'; return; }
  strip.style.display='block';
  row.innerHTML = campaigns.map(c=>{
    const color = neonColor(c);
    const name  = c.name.replace(/\[DEMO\]\s*/,'').trim();
    const loc   = c.location_label||`${c.latitude.toFixed(4)},${c.longitude.toFixed(4)}`;
    return `<div class="ncard" style="border-color:${color}50">
      <div class="ncard-name">${esc(name)}</div>
      <div class="ncard-dist" style="color:${color}">&#x25C6; ${toFt(c._m)} ft</div>
      <div class="ncard-loc">${esc(loc)}</div>
    </div>`;
  }).join('');
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

document.addEventListener('visibilitychange',()=>{
  if(!running) return;
  if(document.hidden){ clearInterval(scanTimer); scanTimer=null; }
  else { scan(); if(!scanTimer) scanTimer=setInterval(scan,SCAN_EVERY); }
});
</script>
</body>
</html>
