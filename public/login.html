<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COHUA | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Space Grotesk', 'sans-serif'] },
                    colors: {
                        neon: { blue: '#00f3ff', magenta: '#ff00ff', green: '#00ff66', yellow: '#ffd700' }
                    }
                }
            }
        }
    </script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .neon-text-blue { text-shadow: 0 0 10px rgba(0, 243, 255, 0.7), 0 0 20px rgba(0, 243, 255, 0.5); }
        .neon-border:hover { box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); border-color: rgba(0, 243, 255, 0.6); }
        .neon-glow-input:focus {
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3), inset 0 0 5px rgba(0, 243, 255, 0.1);
            border-color: #00f3ff;
        }
        .btn-neon {
            background: #00f3ff;
            color: #111;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
            transition: all 0.3s;
        }
        .btn-neon:hover {
            background: #fff;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.8);
        }
        .btn-neon:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 antialiased overflow-x-hidden min-h-screen flex flex-col">

    <!-- NAV -->
    <nav class="fixed w-full z-50 glass-card px-6 py-4 flex justify-between items-center">
        <a href="/" class="text-2xl font-bold tracking-widest text-white">COHUA<span class="text-neon-blue">.</span></a>
        <div class="space-x-6 flex items-center">
            <a href="/#claim" class="px-5 py-2 rounded-full border border-neon-blue text-neon-blue hover:bg-neon-blue hover:text-gray-900 transition font-semibold neon-border">Get Started</a>
        </div>
    </nav>

    <!-- BACKGROUND EFFECTS -->
    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-neon-magenta/10 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-neon-blue/10 rounded-full blur-[120px]"></div>
    </div>

    <!-- LOGIN FORM -->
    <main class="flex-1 flex items-center justify-center px-6 pt-24 pb-12 relative z-10">
        <div class="w-full max-w-md">
            <div class="glass-card rounded-2xl p-8 md:p-10 border border-white/10">
                <!-- Header -->
                <div class="text-center mb-8">
                    <h1 class="text-3xl font-bold mb-2">Welcome Back</h1>
                    <p class="text-gray-400">Sign in to your COHUA dashboard</p>
                </div>

                <!-- Status Messages -->
                <div id="status-message" class="hidden mb-6 p-4 rounded-xl text-sm text-center"></div>

                <!-- Login Form -->
                <form id="login-form" class="space-y-5">
                    <div>
                        <label for="email" class="block text-sm font-semibold text-gray-300 mb-2">Email Address</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                            placeholder="you@company.com"
                            class="w-full px-4 py-3 rounded-xl bg-gray-900/80 border border-white/10 text-white placeholder-gray-500 focus:outline-none neon-glow-input transition"
                        >
                    </div>
                    <div>
                        <label for="password" class="block text-sm font-semibold text-gray-300 mb-2">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            placeholder="Enter your password"
                            class="w-full px-4 py-3 rounded-xl bg-gray-900/80 border border-white/10 text-white placeholder-gray-500 focus:outline-none neon-glow-input transition"
                        >
                    </div>

                    <button
                        type="submit"
                        id="login-btn"
                        class="w-full py-3 rounded-xl btn-neon font-bold text-lg tracking-wide"
                    >
                        Sign In
                    </button>
                </form>

                <!-- Divider -->
                <div class="flex items-center my-6">
                    <div class="flex-1 border-t border-white/10"></div>
                    <span class="px-4 text-sm text-gray-500">or</span>
                    <div class="flex-1 border-t border-white/10"></div>
                </div>

                <!-- Sign Up Form (hidden by default) -->
                <form id="signup-form" class="hidden space-y-5">
                    <div>
                        <label for="signup-email" class="block text-sm font-semibold text-gray-300 mb-2">Email Address</label>
                        <input
                            type="email"
                            id="signup-email"
                            name="email"
                            required
                            placeholder="you@company.com"
                            class="w-full px-4 py-3 rounded-xl bg-gray-900/80 border border-white/10 text-white placeholder-gray-500 focus:outline-none neon-glow-input transition"
                        >
                    </div>
                    <div>
                        <label for="signup-password" class="block text-sm font-semibold text-gray-300 mb-2">Password</label>
                        <input
                            type="password"
                            id="signup-password"
                            name="password"
                            required
                            minlength="6"
                            placeholder="Min 6 characters"
                            class="w-full px-4 py-3 rounded-xl bg-gray-900/80 border border-white/10 text-white placeholder-gray-500 focus:outline-none neon-glow-input transition"
                        >
                    </div>
                    <button
                        type="submit"
                        id="signup-btn"
                        class="w-full py-3 rounded-xl btn-neon font-bold text-lg tracking-wide"
                    >
                        Create Account
                    </button>
                </form>

                <!-- Toggle between Login / Sign Up -->
                <div class="text-center">
                    <button id="toggle-signup" class="text-neon-blue hover:text-white transition text-sm font-semibold">
                        Don't have an account? <span class="underline">Sign up</span>
                    </button>
                </div>
            </div>

            <!-- Back to home -->
            <div class="text-center mt-6">
                <a href="/" class="text-gray-500 hover:text-neon-blue transition text-sm">&larr; Back to home</a>
            </div>
        </div>
    </main>

    <script>
        // ========================================
        // SUPABASE CONFIGURATION
        // Replace these with your actual Supabase project credentials
        // ========================================
        const SUPABASE_URL = 'https://sgredejirqatcmstlzqi.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNncmVkZWppcnFhdGNtc3RsenFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMwMDY3NTUsImV4cCI6MjA4ODU4Mjc1NX0.bV19P9HmMSDe4JGAmJHcmCIjN3kbZvHTuurmCRVD_sA';

        let supabase = null;
        let supabaseReady = false;

        // Initialize Supabase if credentials are configured
        if (SUPABASE_URL && SUPABASE_ANON_KEY) {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            supabaseReady = true;

            // Check if user is already logged in
            supabase.auth.getSession().then(({ data: { session } }) => {
                if (session) {
                    window.location.href = '/dashboard';
                }
            });
        }

        // UI Elements
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const toggleBtn = document.getElementById('toggle-signup');
        const statusMsg = document.getElementById('status-message');
        let isSignupMode = false;

        function showStatus(message, isError = false) {
            statusMsg.textContent = message;
            statusMsg.className = `mb-6 p-4 rounded-xl text-sm text-center ${
                isError
                    ? 'bg-red-500/10 border border-red-500/30 text-red-400'
                    : 'bg-neon-blue/10 border border-neon-blue/30 text-neon-blue'
            }`;
            statusMsg.classList.remove('hidden');
        }

        function hideStatus() {
            statusMsg.classList.add('hidden');
        }

        // Toggle between login and signup
        toggleBtn.addEventListener('click', () => {
            isSignupMode = !isSignupMode;
            hideStatus();
            if (isSignupMode) {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                toggleBtn.innerHTML = 'Already have an account? <span class="underline">Sign in</span>';
            } else {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                toggleBtn.innerHTML = 'Don\'t have an account? <span class="underline">Sign up</span>';
            }
        });

        // Login handler
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');

            if (!supabaseReady) {
                showStatus('Authentication is being set up. Please check back soon!', false);
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Signing in...';
            hideStatus();

            try {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;
                showStatus('Login successful! Redirecting...');
                setTimeout(() => { window.location.href = '/dashboard'; }, 1000);
            } catch (err) {
                showStatus(err.message || 'Login failed. Please try again.', true);
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });

        // Signup handler
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const btn = document.getElementById('signup-btn');

            if (!supabaseReady) {
                showStatus('Authentication is being set up. Please check back soon!', false);
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Creating account...';
            hideStatus();

            try {
                const { data, error } = await supabase.auth.signUp({ email, password });
                if (error) throw error;
                showStatus('Account created! Check your email to confirm, then sign in.');
                btn.disabled = false;
                btn.textContent = 'Create Account';
            } catch (err) {
                showStatus(err.message || 'Signup failed. Please try again.', true);
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        });
    </script>

</body>
</html>
