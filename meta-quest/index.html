<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COHUA | Meta Quest 3 AR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }

    #canvas-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }

    /* HUD overlay — works with WebXR dom-overlay */
    #hud-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    #hud-status {
      position: absolute;
      top: 16px; left: 16px;
      background: rgba(0, 0, 0, 0.7);
      color: #00f3ff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      border: 1px solid rgba(0, 243, 255, 0.3);
      text-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
    }

    #hud-debug {
      position: absolute;
      top: 52px; left: 16px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 12px;
      font-family: monospace;
    }

    /* Enter AR button */
    #enter-ar {
      display: none;
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      padding: 16px 40px;
      background: #00f3ff;
      color: #000;
      font-size: 18px;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      z-index: 20;
      pointer-events: all;
      box-shadow: 0 0 20px rgba(0, 243, 255, 0.5);
      letter-spacing: 2px;
    }
    #enter-ar:hover {
      background: #fff;
      box-shadow: 0 0 30px rgba(0, 243, 255, 0.8);
    }

    /* Loading screen */
    #loading {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.5s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading h1 {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: 8px;
      color: #fff;
      margin-bottom: 8px;
    }
    #loading h1 span { color: #00f3ff; }
    #loading p {
      color: rgba(255, 255, 255, 0.4);
      font-size: 14px;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <!-- Loading screen -->
  <div id="loading">
    <h1>COHUA<span>.</span></h1>
    <p>SPATIAL ADVERTISING ENGINE</p>
  </div>

  <!-- Three.js canvas -->
  <div id="canvas-container"></div>

  <!-- HUD overlay (used by WebXR dom-overlay) -->
  <div id="hud-overlay">
    <div id="hud-status">COHUA  |  Loading...</div>
    <div id="hud-debug"></div>
  </div>

  <!-- Enter AR button (shown only when WebXR is available) -->
  <button id="enter-ar">ENTER AR</button>

  <!-- Import Map for ES modules -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "troika-three-text": "https://cdn.jsdelivr.net/npm/troika-three-text@0.52.4/dist/troika-three-text.esm.js"
    }
  }
  </script>

  <!-- App entry point -->
  <script type="module">
    import './js/app.js';

    // Hide loading screen after a moment
    setTimeout(() => {
      document.getElementById('loading').classList.add('hidden');
    }, 1500);
  </script>

</body>
</html>
