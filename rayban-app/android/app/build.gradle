apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * React Native Gradle Plugin configuration.
 */
react {
    /* Folders */
    //   root = file("../")
    //   reactNativeDir = file("../node_modules/react-native")
    //   codegenDir = file("../node_modules/@react-native/codegen")
    //   cliFile = file("../node_modules/react-native/cli.js")

    /* Variants */
    //   debuggableVariants = ["leanDebug", "fullDebug"]

    /* Bundling */
    //   bundleCommand = "ram-bundle"
    //   bundleAssetName = "index.android.bundle"
    //   entryFile = file("../../index.js")

    /* Hermes */
    hermesCommand = "${rootDir}/../node_modules/react-native/sdks/hermesc/%OS-BIN%/hermesc"
    enableHermesOnlyInRelease = false
}

/**
 * Set this to true to Run Proguard on Release Builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.cohua.rayban"

    defaultConfig {
        applicationId "com.cohua.rayban"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Kotlin coroutines (required for Meta Wearables SDK bridge)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Meta Wearables Device Access Toolkit
    // Maven repo: maven { url 'https://dl.facebook.com/android/maven' }
    // is declared in the root build.gradle allprojects block.
    // Remove the comment below once the SDK artifact is available in CI.
    implementation 'com.meta.wearable:mwdat-core:0.5.0'
    implementation 'com.meta.wearable:mwdat-camera:0.5.0'
    debugImplementation 'com.meta.wearable:mwdat-mockdevice:0.5.0'
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
